# docker-compose.yml
version: '3.8'

services:
  backend:
    build: ./server
    container_name: openmlpipe-backend
    ports:
      - "3001:3001"
    volumes:
      # Map local uploads folder to container
      - ./server/uploads:/app/uploads
      # Persist the SQLite database
      - ./server/openmlpipe.db:/app/openmlpipe.db
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./client
    container_name: openmlpipe-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend